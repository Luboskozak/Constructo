<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">

<title>Constructo</title>

<style>
/* Constructo mobil: černá hlavička a spodní lišta, světlá plocha, žlutá jako zvýraznění */
:root{
  --y:#F4D23C; --y2:#FFF4BF; --yt:#7a6000;
  --k:#131518; --k2:#1d2024; --k3:#2a2e33;
  --bg:#f4f4f1; --card:#fff; --ink:#16191c; --mut:#6b7279; --line:#e4e4df;
  --red:#d63b24; --red2:#fdeae6; --grn:#2f8a52; --grn2:#dcefe3; --blu:#2b6cb0; --blu2:#dfeaf6; --org:#a8650a; --org2:#fbefd5;
  --f:"Hanken Grotesk","Helvetica Neue",Arial,system-ui,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(84px + var(--sb))}
/* hlavička */
.head{background:var(--k);color:#fff;padding:calc(12px + var(--st)) 18px 18px;border-radius:0 0 26px 26px;display:flex;flex-direction:column;gap:14px}
.head .r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:9px}
.logo svg{height:21px;width:auto;fill:var(--y)}
.logo span{font-weight:300;font-size:22px;letter-spacing:.005em}
.me{width:38px;height:38px;border-radius:50%;background:var(--y);color:var(--k);border:0;font-weight:800;font-size:13px}
.head .ttl{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.head h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.035em;line-height:.95}
.head h1 small{display:block;font:600 11.5px var(--mono);color:#9aa2a9;letter-spacing:.02em;margin-bottom:6px}
.pct{font-size:44px;font-weight:900;color:var(--y);letter-spacing:-.04em;line-height:.9;text-align:right;white-space:nowrap}
.pct small{display:block;font-size:10.5px;letter-spacing:.14em;color:#9aa2a9;font-weight:700;text-transform:uppercase;margin-bottom:4px}
.track{height:10px;border-radius:9px;background:var(--k3);position:relative}
.track i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--y)}
.head.small{padding-bottom:14px;border-radius:0 0 22px 22px}
.head.small h2{margin:0;font-size:24px;font-weight:900;letter-spacing:-.03em}
.netline{font-size:12.5px;color:#9aa2a9;display:flex;align-items:center;gap:6px}
.netline b{width:8px;height:8px;border-radius:50%;background:var(--grn);display:inline-block}
.netline.off b{background:#e0a63a}
/* obsah */
main{flex:1;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sec h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.sec button{border:0;background:none;color:var(--mut);font-weight:700;font-size:14px;padding:6px 0}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.kp b{display:block;font-size:28px;font-weight:900;letter-spacing:-.04em;line-height:1.05}
.kp small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.kp .bad b{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.task{cursor:pointer}
.task .t1{display:flex;gap:10px;align-items:flex-start}
.task .t1 .tx{flex:1;min-width:0}
.task h4{margin:0;font-size:16.5px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.task .m{font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px}
.task .m .late{color:var(--red);font-weight:700}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;background:var(--y2);color:var(--yt)}
.thumbs{display:flex;gap:6px;overflow-x:auto}
.thumbs img,.thumbs .ph{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none;background:#e3e3dd}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.p-ok{background:var(--grn2);color:var(--grn)}.p-info{background:var(--blu2);color:var(--blu)}.p-wait{background:var(--org2);color:var(--org)}.p-bad{background:var(--red2);color:var(--red)}
.done-btn{border:0;background:var(--grn);color:#fff;font-weight:800;border-radius:12px;min-height:44px;padding:0 16px;font-size:15px;align-self:flex-start}
.empty{text-align:center;color:var(--mut);padding:26px 12px;font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#e9e9e4;border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;border-radius:11px;min-height:42px;background:transparent;color:var(--mut);font-weight:700;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.banner{display:flex;gap:10px;align-items:center;background:var(--org2);color:var(--org);border-radius:14px;padding:10px 12px;font-weight:600;font-size:14.5px}
.banner.info{background:var(--blu2);color:var(--blu)}
.banner button{margin-left:auto;border:0;background:rgba(0,0,0,.08);border-radius:10px;padding:8px 12px;font-weight:700;color:inherit}
/* spodní lišta */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:var(--k);padding:10px max(6px,env(safe-area-inset-left,0px)) calc(12px + var(--sb));border-radius:24px 24px 0 0}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#8d959c;padding:2px 0;position:relative}
.nav svg{width:24px;height:24px}
.nav button[aria-current="true"]{color:var(--y)}
.nav .cam span{width:58px;height:58px;border-radius:20px;background:var(--y);color:var(--k);display:grid;place-items:center;margin-top:-30px;box-shadow:0 8px 20px -6px rgba(244,210,60,.75)}
.nav .cam svg{width:28px;height:28px}
.nav .cnt{position:absolute;top:-4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
/* formulář hlášení */
.photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.photo{width:92px;height:92px;border-radius:16px;position:relative;flex:none;background:#ddd center/cover}
.photo button{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
.addph{width:92px;height:92px;border-radius:16px;flex:none;border:2px dashed #c9cbc4;background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700}
.addph svg{width:28px;height:28px}
.lbl{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:4px 0 -2px}
.lbl em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;gap:7px;align-items:center;border:2px solid var(--line);background:var(--card);border-radius:99px;padding:5px 13px 5px 5px;font-weight:700;font-size:15px;min-height:46px}
.chip .av{width:32px;height:32px;font-size:11.5px}
.chip.all{padding-left:14px}
.chip[aria-pressed="true"]{border-color:var(--k);background:var(--y2)}
.chip[aria-pressed="true"] .av{background:var(--k);color:var(--y)}
.kind{display:grid;grid-template-columns:1fr 1fr;background:#e9e9e4;border-radius:16px;padding:4px;gap:4px}
.kind button{border:0;border-radius:12px;min-height:56px;font-weight:800;font-size:16px;background:transparent;color:var(--mut);line-height:1.15}
.kind button small{display:block;font-weight:500;font-size:12px}
.kind button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.date{border:2px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--card);min-height:46px}
.qd button{border:2px solid var(--line);background:var(--card);border-radius:12px;min-height:46px;padding:0 12px;font-weight:700}
.objs{display:flex;gap:6px;flex-wrap:wrap}
.obj{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800}
.obj[aria-pressed="true"]{border-color:var(--k);background:var(--y2)}
.txt{display:flex;gap:8px}
.txt textarea{flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:12px;font-size:17px;resize:none;height:110px;background:var(--card)}
.mic{width:68px;flex:none;border:0;border-radius:16px;background:var(--k);color:#fff;display:grid;place-items:center}
.mic svg{width:30px;height:30px}
.mic.on{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.hint{font-size:13px;color:var(--mut);margin:-4px 0 0}
.sendbar{padding:6px 0 4px}
.send{width:100%;min-height:60px;border:0;border-radius:18px;background:var(--k);color:#fff;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px}
.send i{width:26px;height:26px;border-radius:8px;background:var(--y);color:var(--k);display:grid;place-items:center;font-style:normal}
.send:disabled{opacity:.4}
.sum{font-size:13.5px;color:var(--mut);text-align:center;margin-top:6px}
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 16px}
.result .ic{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:var(--grn2);color:var(--grn)}
.result .ic.w{background:var(--org2);color:var(--org)}
.result h2{margin:0;font-size:26px;font-weight:900;letter-spacing:-.03em}
.result p{margin:0;color:var(--mut);max-width:30ch}
.big{min-height:54px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:800;padding:0 22px;font-size:16px}
.big.pri{background:var(--k);border-color:var(--k);color:#fff}
/* úvod a okna */
.setup{min-height:100%;display:flex;flex-direction:column;background:var(--k);color:#fff;padding:calc(30px + var(--st)) 22px calc(24px + var(--sb));gap:18px}
.setup .logo svg{height:30px}.setup .logo span{font-size:32px}
.setup .claim{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8a929a;margin-top:-10px}
.setup .box{background:var(--card);color:var(--ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-top:auto}
.setup h2{margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em}
.setup p{margin:0;color:var(--mut);font-size:15px}
.setup textarea{border:2px solid var(--line);border-radius:14px;padding:12px;min-height:90px;font:14px var(--mono);resize:vertical}
.whos{display:flex;flex-wrap:wrap;gap:8px}
.whos button{border:2px solid var(--line);background:var(--card);border-radius:14px;min-height:50px;padding:0 16px;font-weight:800;font-size:16px}
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;padding:10px 18px calc(18px + var(--sb));display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#d5d6d0;align-self:center}
.sheet h3{margin:0;font-size:21px;font-weight:900;letter-spacing:-.02em;overflow-wrap:anywhere}
.sheet .big-ph img{width:100%;border-radius:14px;display:block;background:#e3e3dd}
.sheet .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.sheet .kv span{color:var(--mut)}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translateX(-50%);background:var(--k);color:#fff;padding:11px 18px;border-radius:14px;z-index:30;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.fileinp{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
body.ro .nav [data-v="hlaseni"],body.ro .nav [data-v="odeslane"]{display:none}
/* závada pro firmu: půdorys se špendlíkem, výřez, odborný text */
.zpin{min-height:64px;font-size:17px}
.zcrop img{width:100%;display:block;border-radius:14px;border:1px solid var(--line);background:#fff}
.zroom{font-size:17px}
.formal{width:100%;min-height:300px;border:2px solid var(--line);border-radius:16px;padding:12px;font-size:15px;line-height:1.45;background:var(--card);resize:vertical}
.zsend{display:flex;flex-direction:column;gap:10px}
.send.wa{background:#1d8f4e}
.send.wa i{background:#fff;color:#1d8f4e}
.send.oba{background:var(--y);color:var(--ink)}.send.oba i{background:var(--ink);color:var(--y)}
.big.zwa{background:#1d8f4e;border-color:#1d8f4e;color:#fff}
.zkomu{font-size:15px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);margin:4px 0 10px}
.zpodpis{font-size:14px;line-height:1.45;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.zkor{margin-top:8px;padding:12px;border-radius:12px;background:var(--y2);border:1px solid var(--y);display:flex;flex-direction:column;gap:6px}
.zkor small{font-weight:400;color:var(--mut)}
.zkor-t{font-size:16px;line-height:1.5;background:#fff;border-radius:8px;padding:10px}
.zkor-t mark{background:var(--y);border-radius:3px;padding:0 2px}
.zkor-go{margin-top:6px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;font-weight:600;font-size:14px;font-family:inherit;color:var(--ink)}
.zkor-ok{color:var(--grn)}
.zthumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.zthumbs span{width:58px;height:58px;border-radius:8px;background:center/cover #ddd}
.zdalsi{display:flex;gap:8px}.zdalsi .big{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}.zdalsi svg{width:20px;height:20px}
.znahled{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto;background:var(--bg);padding:8px;border-radius:10px}.znahled img{width:100%;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.fform{display:flex;flex-direction:column;gap:8px}
.fform input{width:100%}
.pv{position:fixed;inset:0;z-index:40;background:#fff;display:flex;flex-direction:column}
.pv-top{background:var(--k);color:#fff;padding:calc(10px + var(--st)) 12px 10px;display:flex;flex-direction:column;gap:8px}
.pv-r{display:flex;align-items:center;gap:10px;font-size:17px}
.pv-r button{margin-left:auto;border:0;border-radius:10px;min-height:40px;padding:0 14px;background:var(--k3);color:#fff;font-weight:700}
.pv-floors{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pv-floors button{border:0;border-radius:10px;min-height:42px;padding:0 12px;background:var(--k3);color:#fff;font-weight:800;white-space:nowrap;flex:none}
.pv-floors button[aria-pressed="true"]{background:var(--y);color:var(--k)}
.pv-stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#f1f1ec;-webkit-user-select:none;user-select:none}
.pv-in{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff}
.pv-in img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.pv-pin{position:absolute;width:0;height:0;pointer-events:none}
.pv-pin svg{position:absolute;left:-19px;top:-48px;width:38px;height:48px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.pv-zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.pv-zoom button{width:50px;height:50px;border-radius:14px;border:0;background:var(--k);color:#fff;font-size:26px;font-weight:800}
.pv-load{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:var(--k);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700}
.pv-bot{background:var(--card);padding:12px 14px calc(12px + var(--sb));display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.pv-room{font-size:16px;min-height:2.6em}
/* na počítači (iMac, Dell) aplikace jako telefon uprostřed obrazovky */
@media (min-width:760px){
  html{background:#e6e6e1}
  body{max-width:560px;margin:0 auto;box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(0,0,0,.08)}
  .nav{left:50%;right:auto;width:560px;transform:translateX(-50%)}
  .sheet{left:50%;right:auto;width:560px;transform:translateX(-50%)}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <mask id="cx-cut" maskUnits="userSpaceOnUse" x="190" y="130" width="516" height="310"><rect x="190" y="130" width="516" height="310" fill="#fff"/><circle cx="348" cy="285" r="87" fill="#000"/><circle cx="548" cy="285" r="87" fill="#000"/><rect x="420" y="232" width="62" height="106" fill="#000"/></mask>
 <symbol id="cx-mark" viewBox="190 130 516 310"><g mask="url(#cx-cut)"><circle cx="348" cy="285" r="152"/><circle cx="548" cy="285" r="152"/></g><rect x="430" y="268" width="67" height="35"/></symbol>
</defs></svg>

<div id="setup" class="setup" hidden></div>
<div id="app" class="app" hidden>

  <nav class="nav" aria-label="Hlavní nabídka">
    <button type="button" data-v="prehled"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Přehled</button>
    <button type="button" data-v="ukoly"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7H4V5h11"/></svg>Úkoly<span class="cnt" id="cnt-ukoly" hidden></span></button>
    <button type="button" data-v="hlaseni" class="cam"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>Hlášení</button>
    <button type="button" data-v="vedomi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg>Na vědomí</button>
    <button type="button" data-v="odeslane"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>Odeslané<span class="cnt" id="cnt-q" hidden></span></button>
  </nav>
</div>
<input type="file" id="in-cam" class="fileinp" accept="image/*" capture="environment">
<input type="file" id="in-gal" class="fileinp" accept="image/*" multiple>
<div id="overlay" hidden></div>

<script src="queue.js"></script>
<script>
(() => {
  const VERSION = '1.7';
  const WEB_SCRIPT = "https://script.google.com/macros/s/AKfycbwJCT7cNtZyKrk21RItnIu4qu2SsSPhNyYdsbIJ5d8Q91esVBEVe82724ufLctboJb4/exec";  // adresa skriptu stavby; vyplní se při sestavení webové verze (zvací kódy)
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const pad = n => String(n).padStart(2, '0');
  const isoD = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayS = () => isoD(new Date());
  const addD = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return isoD(d); };
  const fmtD = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return `${d}. ${m}.`; };
  const fmtDY = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return `${d}. ${m}. ${y}`; };
  const fmtT = s => s ? new Date(s).toLocaleString('cs-CZ', {day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit'}) : '';
  const DOW = ['NE', 'PO', 'ÚT', 'ST', 'ČT', 'PÁ', 'SO'];
  const week = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); };
  const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const initials = n => { const p = String(n || '?').trim().split(/\s+/); return (p.length > 1 ? p[0][0] + p[p.length - 1][0] : p[0].slice(0, 2)).toUpperCase(); };
  const ls = {get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }};
  const LOGO = '<div class="logo"><svg viewBox="0 0 516 310" aria-hidden="true"><use href="#cx-mark"/></svg><span>Constructo</span></div>';

  let conn = null, me = '', D = null, dataAt = 0, online = navigator.onLine, lastErr = '', Q = [];
  let view = ls.get('cx-view') || 'prehled', ufilter = ls.get('cx-uf') || 'moje';
  // pozvaný „jen nahlíží“: vidí stavbu, nic neposílá ani nemění (server mu změny stejně nepřijme)
  let ro = ls.get('cx-ro') === '1';
  const setRo = v => { ro = !!v; ls.set('cx-ro', ro ? '1' : ''); document.body.classList.toggle('ro', ro); if (ro) { view = 'prehled'; ufilter = 'vse'; } };
  const F = {photos: [], to: new Set(), info: false, end: addD(todayS(), 7), obj: new Set(), text: '', result: null, mode: ls.get('cx-mode') || 'tym'};

  function toast(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 3200); }

  /* ---------- data z programu ---------- */
  const eff = t => { const d = Number(t.done) || 0; if (t.status === 'done' || d >= 100) return 'done'; if (t.status === 'hold') return 'hold'; if (t.end && t.end < todayS()) return 'late'; if (d > 0 || t.status === 'doing') return 'doing'; if (t.kind !== 'simple' && !t.src && t.start && t.start < todayS()) return 'late'; return 'todo'; };
  const tasks = () => (D && D.tasks) || [];
  const simple = () => tasks().filter(t => t.kind === 'simple');
  // sledované úkoly jako v programu pro počítač: úkoly do harmonogramu + úkoly ze zápisů z porad
  const tracked = () => { const z = new Set(); ((D && D.diary) || []).forEach(e => { if (e.kind === 'porada') Object.values(e.added || {}).forEach(id => z.add(id)); }); return tasks().filter(t => t.kind !== 'simple' || (z.has(t.id) && !t.info)); };
  const people = t => [t.owner || '', ...(t.team || [])].filter(Boolean);
  const isMe = n => !!me && fold(n) === fold(me);
  const mine = t => people(t).some(isMe);
  const team = () => {
    const p = (D && D.project) || {};
    const list = Array.isArray(p.team) ? p.team : [];
    const extra = p.peopleV2 ? [] : tasks().flatMap(people);
    return [...new Set([...list, ...extra])].filter(n => n && n !== 'Bez přiřazení').sort((a, b) => a.localeCompare(b, 'cs'));
  };
  const projShort = () => { const n = String((D && D.project && D.project.name) || 'Stavba'); return n.split(',')[0].replace(/^Rekonstrukce( objektu)?\s*/i, '') || n; };
  const avg = a => a.length ? Math.round(a.reduce((s, t) => s + (Number(t.done) || 0), 0) / a.length) : 0;
  const thumbOf = a => a && (a.thumb || (a.id ? `https://drive.google.com/thumbnail?id=${a.id}&sz=w800` : ''));

  /* ---------- start ---------- */
  async function boot() {
    try { conn = await CXQ.kvGet('conn'); me = (await CXQ.kvGet('me')) || ls.get('cx-me'); const c = await CXQ.kvGet('data'); if (c) { D = c.data; dataAt = c.at; } } catch (e) { conn = null; }
    const code = parseCode(decodeURIComponent(location.hash || ''));
    if (code) { conn = code; await CXQ.kvSet('conn', conn); history.replaceState(null, '', location.pathname + location.search); }
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker && navigator.serviceWorker.addEventListener && navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.cx === 'queue') afterQueue(e.data.r); });
    if (!conn) return setupCode();
    if (!D) { await refresh(true); }
    setRo(ro);
    if (!me && !ro) return setupName();
    start();
  }
  function parseCode(t) {
    const m = String(t || '').replace(/\s+/g, '').match(/HYB1-([A-Za-z0-9+/_-]+)/);
    if (!m) return null;
    try { const b = m[1].replace(/-/g, '+').replace(/_/g, '/'); const o = JSON.parse(atob(b + '==='.slice((b.length + 3) % 4))); return o && o.u && o.k ? {url: o.u, key: o.k} : null; } catch (e) { return null; }
  }
  function setupCode(err, skipIos) {
    $('#app').hidden = true; const s = $('#setup'); s.hidden = false;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if (ios && !standalone && !skipIos && !err) {
      s.innerHTML = `${LOGO}<div class="claim">management staveb</div>
        <div class="box"><h2>Nejdřív na plochu</h2>
          <p>1. Dole klepněte na tlačítko <b>Sdílet</b> (čtvereček se šipkou nahoru).</p>
          <p>2. Zvolte <b>Přidat na plochu</b> a potvrďte <b>Přidat</b>.</p>
          <p>3. Zavřete Safari a otevřete <b>Constructo</b> z plochy. Tam zadáte zvací kód.</p>
          <button type="button" class="big" id="su-skip">Pokračovat raději v Safari</button></div>`;
      $('#su-skip').onclick = () => setupCode('', true);
      return;
    }
    s.innerHTML = `${LOGO}<div class="claim">management staveb</div>
      <div class="box"><h2>Připojení ke stavbě</h2>
        <p>${WEB_SCRIPT ? 'Zadejte zvací kód, který vám poslal administrátor stavby (6 znaků). Stačí jednou.' : 'Vložte kód připojení, který vám poslal kolega (začíná HYB1-). Stačí jednou.'}</p>
        <textarea id="su-code" placeholder="${WEB_SCRIPT ? 'např. K7M2QX' : 'HYB1-…'}" autocomplete="off" autocapitalize="characters" spellcheck="false"></textarea>
        ${err ? `<div class="banner">${esc(err)}</div>` : ''}
        <button type="button" class="big pri" id="su-go">Připojit</button>
        ${ZK ? '<button type="button" class="big" id="su-demo">Jen vyzkoušet závady (bez připojení)</button>' : ''}</div>`;
    if (ZK) $('#su-demo').onclick = () => { F.mode = 'zavada'; view = 'hlaseni'; start(); };
    $('#su-go').onclick = async () => {
      const raw = $('#su-code').value;
      let c = parseCode(raw), jmeno = '';
      const kod = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!c && !(WEB_SCRIPT && kod.length === 6)) { toast(WEB_SCRIPT ? 'Zvací kód má 6 znaků, zkontrolujte ho.' : 'Tohle nevypadá jako kód připojení. Má začínat HYB1-'); return; }
      $('#su-go').disabled = true; $('#su-go').textContent = 'Připojuji…';
      if (!c) {
        let r;
        try { r = await CXQ.post({url: WEB_SCRIPT}, {akce: 'pripojit', kod}); }
        catch (e) { return setupCode(e.message === 'OFFLINE' ? 'Telefon je bez internetu. Připojte se a zkuste to znovu.' : e.message, true); }
        if (!r || !r.key) return setupCode(r && r.error && r.error !== 'kod' ? r.error : 'Kód neplatí. Je překlepnutý, propadlý (platí 14 dní), nebo už byl použitý. Požádejte administrátora o nový.', true);
        c = {url: WEB_SCRIPT, key: r.key}; jmeno = String(r.jmeno || '').trim();
        setRo(r.role === 'cteni');
        if (ro) { ls.set('cx-ro-name', jmeno); jmeno = ''; me = ''; await CXQ.kvSet('me', ''); ls.set('cx-me', ''); }
      } else setRo(false);
      conn = c; await CXQ.kvSet('conn', c);
      const ok = await refresh(true);
      if (!ok) { conn = null; await CXQ.kvSet('conn', null); return setupCode(lastErr === 'OFFLINE' ? 'Telefon je bez internetu. Připojte se a zkuste to znovu.' : lastErr, true); }
      if (jmeno) { me = jmeno; await CXQ.kvSet('me', me); ls.set('cx-me', me); toast('Vítejte, ' + me); }
      me || ro ? start() : setupName();
    };
  }
  function setupName() {
    $('#app').hidden = true; const s = $('#setup'); s.hidden = false;
    const ns = team();
    s.innerHTML = `${LOGO}<div class="claim">management staveb</div>
      <div class="box"><h2>Kdo jste?</h2><p>Vyberte své jméno. Zapíše se jako zadavatel hlášení a podle něj uvidíte své úkoly.</p>
        <div class="whos">${ns.map(n => `<button type="button" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>
        ${ns.length ? '' : '<p>V programu zatím nikdo není. Napište své příjmení:</p>'}
        <input id="su-name" class="date" placeholder="Jiné jméno (příjmení)" autocomplete="family-name">
        <button type="button" class="big pri" id="su-ok">Pokračovat</button></div>`;
    const set = async n => { me = n.trim(); if (!me) return; await CXQ.kvSet('me', me); ls.set('cx-me', me); start(); };
    s.querySelectorAll('[data-n]').forEach(b => b.onclick = () => set(b.dataset.n));
    $('#su-ok').onclick = () => { const n = $('#su-name').value; if (!n.trim()) { toast('Vyberte nebo napište jméno.'); return; } set(n); };
  }
  let started = false;
  // program sjednotil jména (Kozák → Luboš Kozák): telefon si své jméno přepíše sám
  function fixMe() { const m = D && D.project && D.project.renamed && D.project.renamed[me]; if (m && m !== me) { me = m; CXQ.kvSet('me', me); ls.set('cx-me', me); } }
  function start() {
    fixMe();
    $('#setup').hidden = true; $('#app').hidden = false;
    if (!started) {
      started = true;
      document.querySelectorAll('.nav [data-v]').forEach(b => b.onclick = () => go(b.dataset.v, b.dataset.v === 'hlaseni'));
      setInterval(() => { if (document.visibilityState === 'visible') { refresh(); pump(); } }, 30000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { refresh(); pump(); } });
      addEventListener('online', () => { online = true; pump(); refresh(); render(); });
      addEventListener('offline', () => { online = false; render(); });
      addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; render(); });
    }
    loadQ().then(() => { render(); pump(); refresh(); });
  }
  let installEvt = null;

  async function refresh(first) {
    if (!conn) return false;
    try { const r = await CXQ.get(conn); if (r.data) { D = r.data; dataAt = Date.now(); fixMe(); } online = true; lastErr = ''; if (!first) render(); return true; }
    catch (e) { lastErr = e.message; if (e.message === 'OFFLINE') online = false; if (!first) render(); return false; }
  }
  async function loadQ() { try { Q = await CXQ.all(); } catch (e) { Q = []; } }
  let pumping = false;
  async function pump() {
    if (pumping || !conn) return; pumping = true;
    try { const r = await CXQ.process(); await afterQueue(r); } finally { pumping = false; }
  }
  async function afterQueue(r) {
    const c = await CXQ.kvGet('data').catch(() => null); if (c && c.at >= dataAt) { D = c.data; dataAt = c.at; }
    await loadQ();
    if (r && r.err && r.err !== 'OFFLINE') lastErr = r.err;
    if (r && r.sent && F.result && F.result.cid && Q.some(x => x.cid === F.result.cid && x.state === 'sent')) F.result.sent = true;
    render();
  }
  function kick() {
    if (navigator.serviceWorker && navigator.serviceWorker.ready && 'SyncManager' in window) navigator.serviceWorker.ready.then(r => r.sync.register('cx-odeslat')).catch(() => {});
    pump();
  }

  /* ---------- vykreslení ---------- */
  function go(v, camera) {
    if (v === 'hlaseni' && F.result) F.result = null;
    view = v; ls.set('cx-view', v); render(); scrollTo(0, 0);
    if (camera && !F.photos.length) { zCam = true; $('#in-cam').click(); }
  }
  function render() {
    if ($('#app').hidden) return;
    // osoba s přístupem „jen nahlíží“ (nastavuje správce v Lidech) má na mobilu jen prohlížení
    { const pp = (D && D.project && D.project.people) || {}, nah = !!me && Object.keys(pp).some(n => isMe(n) && pp[n] && pp[n].access === 'nahlizi'), r = ls.get('cx-ro') === '1' || nah;
      if (r !== ro) { ro = r; document.body.classList.toggle('ro', ro); if (ro) { view = 'prehled'; ufilter = 'vse'; } } }
    document.querySelectorAll('.nav [data-v]').forEach(b => b.setAttribute('aria-current', b.dataset.v === view));
    const myOpen = simple().filter(t => !t.info && mine(t) && eff(t) !== 'done').length;
    $('#cnt-ukoly').hidden = !myOpen; $('#cnt-ukoly').textContent = myOpen;
    const waiting = Q.filter(x => x.state !== 'sent').length;
    $('#cnt-q').hidden = !waiting; $('#cnt-q').textContent = waiting;
    if (ro && (view === 'hlaseni' || view === 'odeslane')) view = 'prehled';
    const V = {prehled: vPrehled, ukoly: vUkoly, hlaseni: vHlaseni, vedomi: vVedomi, odeslane: vOdeslane}[view] || vPrehled;
    $('#view').innerHTML = V();
    bind();
  }
  const netline = () => {
    const t = dataAt ? new Date(dataAt).toLocaleTimeString('cs-CZ', {hour: '2-digit', minute: '2-digit'}) : '';
    return online && !lastErr ? `<div class="netline"><b></b>Aktuální · ${t}</div>` : `<div class="netline off"><b></b>${online ? 'Spojení s Googlem nejde' : 'Bez signálu'}${t ? ' · data z ' + t : ''}</div>`;
  };
  const headSmall = title => `<header class="head small"><div class="r">${LOGO}<button type="button" class="me" data-act="settings" aria-label="Nastavení">${esc(initials(me))}</button></div><div class="r"><h2>${esc(title)}</h2>${netline()}</div></header>`;
  function taskCard(t, opts) {
    const st = eff(t), late = st === 'late', who = people(t).join(', ') || 'Bez přiřazení', att = t.att || [];
    const canDone = !ro && !t.info && t.kind === 'simple' && st !== 'done' && (mine(t) || !t.owner);
    return `<div class="card task" data-t="${esc(t.id)}">
      <div class="t1"><span class="av">${esc(initials(t.owner || '–'))}</span><div class="tx"><h4>${esc(t.title)}</h4>
        <div class="m"><span>${esc(who)}</span>${t.info ? '' : st === 'done' ? '<span>splněno</span>' : t.end ? `<span class="${late ? 'late' : ''}">do ${fmtD(t.end)}${late ? ' · po termínu' : ''}</span>` : ''}${t.createdBy ? `<span>zadal ${esc(t.createdBy)}</span>` : ''}${t.obj ? `<span>objekt ${esc(t.obj)}</span>` : ''}</div></div>
        ${t.info ? '<span class="pill p-info">Na vědomí</span>' : t.kind !== 'simple' && st !== 'done' ? `<span class="pill${late ? ' p-bad' : ''}">${Number(t.done) || 0} %</span>` : st === 'done' ? '<span class="pill p-ok">Splněno</span>' : late ? '<span class="pill p-bad">Skluz</span>' : ''}</div>
      ${att.length ? `<div class="thumbs">${att.map(a => `<img src="${esc(thumbOf(a))}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph'}))">`).join('')}</div>` : ''}
      ${canDone && opts !== 'nobtn' ? `<button type="button" class="done-btn" data-done="${esc(t.id)}">✓ Splněno</button>` : ''}
    </div>`;
  }
  function vPrehled() {
    const tr = tracked(), a = avg(tr), late = tr.filter(t => eff(t) === 'late').length, doing = tr.filter(t => eff(t) === 'doing').length;
    const d = new Date();
    const my = tasks().filter(t => !t.info && (ro || mine(t)) && eff(t) !== 'done').sort((x, y) => (x.end || '9999').localeCompare(y.end || '9999'));
    const info = simple().filter(t => t.info).sort((x, y) => (y.createdAt || '').localeCompare(x.createdAt || '')).slice(0, 3);
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    return `<header class="head">
      <div class="r">${LOGO}<button type="button" class="me" data-act="settings" aria-label="Nastavení">${esc(initials(me))}</button></div>
      <div class="ttl"><h1><small>${DOW[d.getDay()]} ${d.getDate()}. ${d.getMonth() + 1}. · TÝDEN ${week(d)}</small>${esc(projShort())}</h1><div class="pct"><small>Hotovo</small>${a} %</div></div>
      <div class="track"><i style="width:${a}%"></i></div>${netline()}
    </header>
    <main>
      ${!standalone && ios ? '<div class="banner info">Přidejte si Constructo na plochu: dole klepněte na Sdílet a zvolte Přidat na plochu.</div>' : ''}
      ${!standalone && installEvt ? '<div class="banner info">Constructo jde nainstalovat jako aplikaci.<button type="button" data-act="install">Nainstalovat</button></div>' : ''}
      ${!D ? '<div class="banner">Data se ještě nenačetla. Připojte se k internetu.</div>' : ''}
      <div class="kp"><div><b>${tr.length}</b><small>Úkolů</small></div><div><b>${doing}</b><small>Probíhá</small></div><div class="${late ? 'bad' : ''}"><b>${late}</b><small>Skluz</small></div></div>
      ${ro ? '<div class="banner info">Jen prohlížení: vidíte stav stavby, ale nic neměníte.</div>' : ''}
      <div class="sec"><h3>${ro ? 'Otevřené úkoly' : 'Moje úkoly'}</h3><button type="button" data-go="ukoly">vše →</button></div>
      ${my.length ? my.slice(0, 5).map(t => taskCard(t)).join('') : `<div class="card empty"><b>Nic k vyřízení</b>Až vám někdo zadá úkol, objeví se tady.</div>`}
      ${info.length ? `<div class="sec"><h3>Na vědomí</h3><button type="button" data-go="vedomi">vše →</button></div>${info.map(t => taskCard(t)).join('')}` : ''}
    </main>`;
  }
  function vUkoly() {
    const all = tasks().filter(t => !t.info);
    const f = {moje: t => mine(t), zadal: t => isMe(t.createdBy), vse: () => true}[ufilter] || (() => true);
    const open = all.filter(t => f(t) && eff(t) !== 'done').sort((x, y) => (x.end || '9999').localeCompare(y.end || '9999'));
    const done = all.filter(t => f(t) && eff(t) === 'done').sort((x, y) => (y.doneAt || '').localeCompare(x.doneAt || '')).slice(0, 10);
    return `${headSmall('Úkoly')}<main>
      <div class="seg"${ro ? ' hidden' : ''}>${[['moje', 'Moje'], ['zadal', 'Zadal jsem'], ['vse', 'Všechny']].map(([k, l]) => `<button type="button" data-uf="${k}" aria-pressed="${ufilter === k}">${l}</button>`).join('')}</div>
      ${open.length ? open.map(t => taskCard(t)).join('') : `<div class="card empty"><b>Žádné nesplněné úkoly</b>${ufilter === 'moje' ? 'Nemáte nic k vyřízení.' : ''}</div>`}
      ${done.length ? `<div class="sec"><h3>Nedávno splněné</h3></div>${done.map(t => taskCard(t, 'nobtn')).join('')}` : ''}
    </main>`;
  }
  function vVedomi() {
    const lim = addD(todayS(), -30);
    const info = simple().filter(t => t.info && (t.start || '') >= lim).sort((x, y) => (y.createdAt || '').localeCompare(x.createdAt || ''));
    return `${headSmall('Na vědomí')}<main>${info.length ? info.map(t => taskCard(t)).join('') : '<div class="card empty"><b>Za poslední měsíc nic</b>Informace pro tým, třeba nepořádek na stavbě, se objeví tady.</div>'}</main>`;
  }
  function vOdeslane() {
    const items = Q.filter(x => x.kind === 'report').sort((a, b) => b.at.localeCompare(a.at));
    const waiting = Q.filter(x => x.state !== 'sent').length;
    return `${headSmall('Odeslané')}<main>
      ${waiting ? `<div class="banner">${waiting === 1 ? '1 položka čeká' : waiting + ' položky čekají'} na odeslání${online ? '' : ', odejdou samy, až bude signál'}.<button type="button" data-act="pump">Odeslat</button></div>` : ''}
      ${lastErr && lastErr !== 'OFFLINE' ? `<div class="banner">${esc(lastErr)}</div>` : ''}
      ${items.length ? items.map(it => {
        const ph = (it.photos || [])[0], mail = it.mail || {};
        const st = it.state === 'sent' ? '<span class="pill p-ok">Odesláno</span>' : it.err ? '<span class="pill p-bad">Chyba</span>' : '<span class="pill p-wait">Čeká</span>';

    const a = mistniFirmy(), sp = spolecneFirmy(), ed = a.find(x => x.id === editId) || null;
    const s = sheet(`<h3>Firmy (subdodavatelé)</h3>
      <p class="hint">Seznam firem se pohodlně spravuje v programu na počítači: <b>Data → Firmy – adresy pro závady</b>. Telefon si ho převezme sám.${conn ? '' : ' (Ve zkoušce bez připojení se firmy z počítače nenačtou.)'}</p>
      ${sp.map(x => `<div class="card"><b>${esc(x.firma)}</b><span class="hint">${esc([x.email, x.tel].filter(Boolean).join(' · ') || 'bez kontaktu')} · z počítače</span></div>`).join('')}
      ${a.length ? '<p class="hint" style="margin:6px 0 0">Jen v tomto telefonu:</p>' : ''}
      ${a.map(x => `<div class="card"><b>${esc(x.firma)}</b><span class="hint">${esc([x.email, x.tel].filter(Boolean).join(' · ') || 'bez kontaktu')}</span><div class="acts"><button type="button" class="big" data-fe="${esc(x.id)}">Upravit</button><button type="button" class="big" data-fd="${esc(x.id)}" style="color:var(--red)">Smazat</button></div></div>`).join('')}
      <div class="card fform"><b>${ed ? 'Upravit firmu' : 'Rychle přidat firmu jen v tomto telefonu'}</b>
        <input class="date" id="ff-n" placeholder="Název firmy, např. ALPOD" value="${esc(ed ? ed.firma : '')}">
        <input class="date" id="ff-e" type="email" inputmode="email" autocapitalize="off" autocomplete="off" placeholder="E-mail" value="${esc(ed ? ed.email : '')}">
        <input class="date" id="ff-t" type="tel" inputmode="tel" placeholder="Telefon pro WhatsApp, např. 777 123 456" value="${esc(ed ? ed.tel : '')}">
        <button type="button" class="big pri" id="ff-ok">Uložit firmu</button></div>
      <button type="button" class="big" data-close>Hotovo</button>`);
    s.querySelector('[data-close]').onclick = () => { closeSheet(); render(); };
    s.querySelectorAll('[data-fe]').forEach(b => b.onclick = () => firmyDlg(b.dataset.fe));
    s.querySelectorAll('[data-fd]').forEach(b => b.onclick = () => {
      if (!b.dataset.arm) { b.dataset.arm = 1; b.textContent = 'Opravdu smazat?'; return; }
      ls.set('cx-firmy', JSON.stringify(a.filter(x => x.id !== b.dataset.fd))); if (Z.firma === b.dataset.fd) Z.firma = ''; firmyDlg();
    });
    $('#ff-ok').onclick = () => {
      const n = $('#ff-n').value.trim(), em = $('#ff-e').value.trim(), tel = $('#ff-t').value.trim();
      if (!n) { toast('Napište název firmy.'); return; }
      if (em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { toast('E-mail nevypadá správně.'); return; }
      const x = {id: ed ? ed.id : 'f' + Date.now().toString(36), firma: n, email: em, tel};
      ls.set('cx-firmy', JSON.stringify(ed ? a.map(y => y.id === ed.id ? x : y) : a.concat(x)));
      Z.firma = x.id; ls.set('cx-firma', x.id);
      toast('Firma uložena'); firmyDlg();
    };
  }
  // zprávu napíše Claude přes skript na Googlu (klíč je jen tam, v aplikaci ani na webu není).
  // Když je popis nejasný, Claude se nejdřív zeptá; odpověď se pošle znovu s celým popisem.
  async function zPriprav(bez) {
    if (!F.photos.length && !Z.text.trim()) { toast('Přidejte fotku nebo popis.'); return; }
    if (!jaJmeno()) { toast('Napište nahoře do podpisu své jméno.'); return; }
    if (!conn) { Z.formal = odborne(); Z.question = ''; render(); toast('Zprávu napsala šablona. Claude píše, až když je aplikace připojená ke stavbě.'); return; }
    Z.busy = true; render();
    const vyrez = Z.crop ? await new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => res(''); r.readAsDataURL(Z.crop.blob); }) : '';
    const body = {key: conn.key, akce: 'odborne', typ: zTyp().l, ton: ZTON[Z.typ] || '', predmet: zPredmet(), misto: zMisto(), popis: Z.text.trim(), dotazy: Z.qa, bezDotazu: !!bez,
      termin: fmtDY(Z.end), stavba: stavba(), datum: fmtDY(todayS()), podpis: podpis(), vyrez, fotky: F.photos.slice(0, 3).map(x => x.b64)};
    let r;
    try {
      // Claude si může dohledat ČSN nebo postup výrobce, proto delší čekání než u ostatních požadavků
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 170000);
      const res = await fetch(conn.url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect: 'follow', signal: ctl.signal});
      clearTimeout(tm); r = JSON.parse(await res.text());
    } catch (e) { r = {error: navigator.onLine ? 'Claude neodpověděl včas. Zkuste to znovu.' : 'Bez signálu.'}; }
    Z.busy = false;
    if (r && r.dotaz) { Z.question = r.dotaz; Z.answer = ''; }
    else if (r && r.text) { Z.formal = r.text; Z.question = ''; toast('Zprávu napsal Claude. Zkontrolujte ji a schvalte.'); }
    else {
      Z.formal = odborne(); Z.question = '';
      toast((!r || (!r.error && !r.text) ? 'Skript na Googlu je starý, Claude umí až verze 7.' : r.error === 'klic' ? 'Na Googlu ještě není vložený klíč pro Claude.' : r.error === 'heslo' ? 'Aplikace není správně připojená ke stavbě.' : r.error) + ' Zprávu zatím napsala šablona.');
    }
    if (view === 'hlaseni') render();
  }
  function zDetail(id) {
    const e = zHist().find(x => x.id === id); if (!e) return;
    const s = sheet(`<h3>${esc(e.typ)}${e.room ? ' · ' + esc(e.room) : ''}</h3>
      ${e.thumb ? `<div class="big-ph"><img src="${e.thumb}" alt=""></div>` : ''}
      <div class="kv"><span>Firma</span><b>${esc(e.firma || '—')}</b><span>Odesláno</span><span style="color:var(--ink)">${fmtT(e.at)} · ${e.via.map(v => v === 'wa' ? 'WhatsApp' : 'e-mail').join(', ')}</span></div>
      <textarea class="formal" readonly>${esc(e.text)}</textarea>
      <button type="button" class="big" data-close>Zavřít</button>`);
    s.querySelector('[data-close]').onclick = closeSheet;
  }

  /* ---------- okna ---------- */
  function sheet(html) {
    const o = $('#overlay'); o.hidden = false;
    o.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true"><span class="grab"></span>${html}</div>`;
    o.querySelector('.scrim').onclick = closeSheet;
    return o.querySelector('.sheet');
  }
  function closeSheet() { const o = $('#overlay'); o.hidden = true; o.innerHTML = ''; }
  function detail(id) {
    const t = tasks().find(x => x.id === id); if (!t) return;
    const st = eff(t), att = t.att || [], canDone = !ro && !t.info && t.kind === 'simple' && st !== 'done' && (mine(t) || !t.owner);
    const s = sheet(`<h3>${esc(t.title)}</h3>
      ${att.length ? `<div class="big-ph" style="display:flex;flex-direction:column;gap:8px">${att.map(a => `<a href="${esc(a.url || thumbOf(a))}" target="_blank" rel="noopener"><img src="${esc(thumbOf(a))}" alt="Fotka ze stavby"></a>`).join('')}</div>` : ''}
      <div class="kv"><span>${t.info ? 'Pro' : 'Komu'}</span><b>${esc(people(t).join(', ') || 'Bez přiřazení')}</b>
        <span>Zadal</span><span style="color:var(--ink)">${esc(t.createdBy || '—')} · ${fmtT(t.createdAt) || fmtDY(t.start)}</span>
        ${t.info ? '' : `<span>Termín</span><span style="color:${st === 'late' ? 'var(--red)' : 'var(--ink)'}">${t.end ? fmtDY(t.end) : 'bez termínu'}</span>`}
        ${t.obj ? `<span>Objekt</span><span style="color:var(--ink)">${esc(t.obj)}</span>` : ''}
        <span>Stav</span><span style="color:var(--ink)">${t.info ? 'Na vědomí' : st === 'done' ? `Splněno ${t.doneBy ? '· ' + esc(t.doneBy) : ''}` : st === 'late' ? 'Po termínu' : 'Nesplněno'}</span></div>
      ${t.missed && st !== 'done' ? `<div class="banner">Důvod nesplnění: ${esc(t.missed)}</div>` : ''}
      <div class="acts">${canDone ? `<button type="button" class="done-btn" data-done="${esc(t.id)}">✓ Splněno</button>` : ''}<button type="button" class="big" data-close>Zavřít</button></div>
      ${!t.info && st !== 'done' && !canDone ? `<p class="hint">Splnění potvrzuje ${esc(people(t).join(', '))}.</p>` : ''}`);
    s.querySelectorAll('[data-done]').forEach(b => b.onclick = () => markDone(b.dataset.done));
    s.querySelector('[data-close]').onclick = closeSheet;
  }
  function settings() {
    const s = sheet(`<h3>Nastavení</h3>
      <div class="kv"><span>Jméno</span><b>${esc(ro ? (ls.get('cx-ro-name') || me || '') + ' · jen prohlížení' : me)}</b><span>Stavba</span><span style="color:var(--ink)">${esc(projShort())}</span>
        <span>Spojení</span><span style="color:var(--ink)">${online && !lastErr ? 'v pořádku' : esc(lastErr === 'OFFLINE' || !online ? 'bez signálu' : lastErr)}</span><span>Verze</span><span style="color:var(--ink)">Constructo mobil ${VERSION}</span></div>
      <div class="acts"><button type="button" class="big" id="st-name">Změnit jméno</button><button type="button" class="big" id="st-ref">Načíst znovu</button></div>
      <div class="acts"><button type="button" class="big" id="st-off" style="color:var(--red)">Odpojit telefon</button><button type="button" class="big pri" data-close>Hotovo</button></div>`);
    s.querySelector('[data-close]').onclick = closeSheet;
    $('#st-name').hidden = ro;
    $('#st-name').onclick = () => { closeSheet(); setupName(); };
    $('#st-ref').onclick = async () => { toast('Načítám…'); const ok = await refresh(); toast(ok ? 'Načteno' : 'Bez spojení'); closeSheet(); };
    const off = $('#st-off'); off.onclick = async () => {
      if (!off.dataset.arm) { off.dataset.arm = 1; off.textContent = 'Opravdu odpojit?'; return; }
      await CXQ.kvSet('conn', null); await CXQ.kvSet('data', null); conn = null; D = null; setRo(false); closeSheet(); setupCode();
    };
  }

  boot();
})();
</script>
</body>
</html>
