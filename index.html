<head>

<style>
/* Constructo mobil: černá hlavička a spodní lišta, světlá plocha, žlutá jako zvýraznění */
:root{
  --y:#F4D23C; --y2:#FFF4BF; --yt:#7a6000;
  --k:#131518; --k2:#1d2024; --k3:#2a2e33;
  --bg:#f4f4f1; --card:#fff; --ink:#16191c; --mut:#6b7279; --line:#e4e4df;
  --red:#d63b24; --red2:#fdeae6; --grn:#2f8a52; --grn2:#dcefe3; --blu:#2b6cb0; --blu2:#dfeaf6; --org:#a8650a; --org2:#fbefd5;
  --f:"Hanken Grotesk","Helvetica Neue",Arial,system-ui,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(84px + var(--sb))}
/* hlavička */
.head{background:var(--k);color:#fff;padding:calc(12px + var(--st)) 18px 18px;border-radius:0 0 26px 26px;display:flex;flex-direction:column;gap:14px}
.head .r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:9px}
.logo svg{height:21px;width:auto;fill:var(--y)}
.logo span{font-weight:300;font-size:22px;letter-spacing:.005em}
.me{width:38px;height:38px;border-radius:50%;background:var(--y);color:var(--k);border:0;font-weight:800;font-size:13px}
.head .ttl{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.head h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.035em;line-height:.95}
.head h1 small{display:block;font:600 11.5px var(--mono);color:#9aa2a9;letter-spacing:.02em;margin-bottom:6px}
.pct{font-size:44px;font-weight:900;color:var(--y);letter-spacing:-.04em;line-height:.9;text-align:right;white-space:nowrap}
.pct small{display:block;font-size:10.5px;letter-spacing:.14em;color:#9aa2a9;font-weight:700;text-transform:uppercase;margin-bottom:4px}
.track{height:10px;border-radius:9px;background:var(--k3);position:relative}
.track i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--y)}
.head.small{padding-bottom:14px;border-radius:0 0 22px 22px}
.head.small h2{margin:0;font-size:24px;font-weight:900;letter-spacing:-.03em}
.netline{font-size:12.5px;color:#9aa2a9;display:flex;align-items:center;gap:6px}
.netline b{width:8px;height:8px;border-radius:50%;background:var(--grn);display:inline-block}
.netline.off b{background:#e0a63a}
/* obsah */
main{flex:1;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sec h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.sec button{border:0;background:none;color:var(--mut);font-weight:700;font-size:14px;padding:6px 0}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.kp b{display:block;font-size:28px;font-weight:900;letter-spacing:-.04em;line-height:1.05}
.kp small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.kp .bad b{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.task{cursor:pointer}
.task .t1{display:flex;gap:10px;align-items:flex-start}
.task .t1 .tx{flex:1;min-width:0}
.task h4{margin:0;font-size:16.5px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.task .m{font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px}
.task .m .late{color:var(--red);font-weight:700}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;background:var(--y2);color:var(--yt)}
.thumbs{display:flex;gap:6px;overflow-x:auto}
.thumbs img,.thumbs .ph{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none;background:#e3e3dd}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.p-ok{background:var(--grn2);color:var(--grn)}.p-info{background:var(--blu2);color:var(--blu)}.p-wait{background:var(--org2);color:var(--org)}.p-bad{background:var(--red2);color:var(--red)}
.done-btn{border:0;background:var(--grn);color:#fff;font-weight:800;border-radius:12px;min-height:44px;padding:0 16px;font-size:15px;align-self:flex-start}
.empty{text-align:center;color:var(--mut);padding:26px 12px;font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#e9e9e4;border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;border-radius:11px;min-height:42px;background:transparent;color:var(--mut);font-weight:700;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.banner{display:flex;gap:10px;align-items:center;background:var(--org2);color:var(--org);border-radius:14px;padding:10px 12px;font-weight:600;font-size:14.5px}
.banner.info{background:var(--blu2);color:var(--blu)}
.banner button{margin-left:auto;border:0;background:rgba(0,0,0,.08);border-radius:10px;padding:8px 12px;font-weight:700;color:inherit}
/* spodní lišta */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:var(--k);padding:10px max(6px,env(safe-area-inset-left,0px)) calc(12px + var(--sb));border-radius:24px 24px 0 0}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#8d959c;padding:2px 0;position:relative}
.nav svg{width:24px;height:24px}
.nav button[aria-current="true"]{color:var(--y)}
.nav .cam span{width:58px;height:58px;border-radius:20px;background:var(--y);color:var(--k);display:grid;place-items:center;margin-top:-30px;box-shadow:0 8px 20px -6px rgba(244,210,60,.75)}
.nav .cam svg{width:28px;height:28px}
.nav .cnt{position:absolute;top:-4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
/* formulář hlášení */
.photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.photo{width:92px;height:92px;border-radius:16px;position:relative;flex:none;background:#ddd center/cover}
.photo button{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
.addph{width:92px;height:92px;border-radius:16px;flex:none;border:2px dashed #c9cbc4;background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700}
.addph svg{width:28px;height:28px}
.lbl{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:4px 0 -2px}
.lbl em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;gap:7px;align-items:center;border:2px solid var(--line);background:var(--card);border-radius:99px;padding:5px 13px 5px 5px;font-weight:700;font-size:15px;min-height:46px}
.chip .av{width:32px;height:32px;font-size:11.5px}
.chip.all{padding-left:14px}
.chip[aria-pressed="true"]{border-color:var(--k);background:var(--y2)}
.chip[aria-pressed="true"] .av{background:var(--k);color:var(--y)}
.kind{display:grid;grid-template-columns:1fr 1fr;background:#e9e9e4;border-radius:16px;padding:4px;gap:4px}
.kind button{border:0;border-radius:12px;min-height:56px;font-weight:800;font-size:16px;background:transparent;color:var(--mut);line-height:1.15}
.kind button small{display:block;font-weight:500;font-size:12px}
.kind button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.date{border:2px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--card);min-height:46px}
.qd button{border:2px solid var(--line);background:var(--card);border-radius:12px;min-height:46px;padding:0 12px;font-weight:700}
.objs{display:flex;gap:6px;flex-wrap:wrap}
.obj{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800}
.obj[aria-pressed="true"]{border-color:var(--k);background:var(--y2)}
.txt{display:flex;gap:8px}
.txt textarea{flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:12px;font-size:17px;resize:none;height:110px;background:var(--card)}
.mic{width:68px;flex:none;border:0;border-radius:16px;background:var(--k);color:#fff;display:grid;place-items:center}
.mic svg{width:30px;height:30px}
.mic.on{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.hint{font-size:13px;color:var(--mut);margin:-4px 0 0}
.sendbar{padding:6px 0 4px}
.send{width:100%;min-height:60px;border:0;border-radius:18px;background:var(--k);color:#fff;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px}
.send i{width:26px;height:26px;border-radius:8px;background:var(--y);color:var(--k);display:grid;place-items:center;font-style:normal}
.send:disabled{opacity:.4}
.sum{font-size:13.5px;color:var(--mut);text-align:center;margin-top:6px}
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 16px}
.result .ic{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:var(--grn2);color:var(--grn)}
.result .ic.w{background:var(--org2);color:var(--org)}
.result h2{margin:0;font-size:26px;font-weight:900;letter-spacing:-.03em}
.result p{margin:0;color:var(--mut);max-width:30ch}
.big{min-height:54px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:800;padding:0 22px;font-size:16px}
.big.pri{background:var(--k);border-color:var(--k);color:#fff}
/* úvod a okna */
.setup{min-height:100%;display:flex;flex-direction:column;background:var(--k);color:#fff;padding:calc(30px + var(--st)) 22px calc(24px + var(--sb));gap:18px}
.setup .logo svg{height:30px}.setup .logo span{font-size:32px}
.setup .claim{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8a929a;margin-top:-10px}
.setup .box{background:var(--card);color:var(--ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-top:auto}
.setup h2{margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em}
.setup p{margin:0;color:var(--mut);font-size:15px}
.setup textarea{border:2px solid var(--line);border-radius:14px;padding:12px;min-height:90px;font:14px var(--mono);resize:vertical}
.whos{display:flex;flex-wrap:wrap;gap:8px}
.whos button{border:2px solid var(--line);background:var(--card);border-radius:14px;min-height:50px;padding:0 16px;font-weight:800;font-size:16px}
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;padding:10px 18px calc(18px + var(--sb));display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#d5d6d0;align-self:center}
.sheet h3{margin:0;font-size:21px;font-weight:900;letter-spacing:-.02em;overflow-wrap:anywhere}
.sheet .big-ph img{width:100%;border-radius:14px;display:block;background:#e3e3dd}
.sheet .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.sheet .kv span{color:var(--mut)}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translateX(-50%);background:var(--k);color:#fff;padding:11px 18px;border-radius:14px;z-index:30;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.fileinp{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
body.ro .nav [data-v="hlaseni"],body.ro .nav [data-v="odeslane"]{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <mask id="cx-cut" maskUnits="userSpaceOnUse" x="190" y="130" width="516" height="310"><rect x="190" y="130" width="516" height="310" fill="#fff"/><circle cx="348" cy="285" r="87" fill="#000"/><circle cx="548" cy="285" r="87" fill="#000"/><rect x="420" y="232" width="62" height="106" fill="#000"/></mask>

<div id="app" class="app" hidden>
  <div id="view"></div>
  <nav class="nav" aria-label="Hlavní nabídka">
    <button type="button" data-v="prehled"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Přehled</button>
    <button type="button" data-v="ukoly"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7H4V5h11"/></svg>Úkoly<span class="cnt" id="cnt-ukoly" hidden></span></button>

<script>
(() => {
  const VERSION = '1.6';
  const WEB_SCRIPT = "https://script.google.com/macros/s/AKfycbwJCT7cNtZyKrk21RItnIu4qu2SsSPhNyYdsbIJ5d8Q91esVBEVe82724ufLctboJb4/exec";  // adresa skriptu stavby; vyplní se při sestavení webové verze (zvací kódy)
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const pad = n => String(n).padStart(2, '0');
  const isoD = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayS = () => isoD(new Date());
  const addD = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return isoD(d); };
  const fmtD = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return `${d}. ${m}.`; };
  const fmtDY = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return `${d}. ${m}. ${y}`; };
  const fmtT = s => s ? new Date(s).toLocaleString('cs-CZ', {day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit'}) : '';
  const DOW = ['NE', 'PO', 'ÚT', 'ST', 'ČT', 'PÁ', 'SO'];
  const week = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); };
  const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const initials = n => { const p = String(n || '?').trim().split(/\s+/); return (p.length > 1 ? p[0][0] + p[p.length - 1][0] : p[0].slice(0, 2)).toUpperCase(); };
  const ls = {get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }};
  const LOGO = '<div class="logo"><svg viewBox="0 0 516 310" aria-hidden="true"><use href="#cx-mark"/></svg><span>Constructo</span></div>';

  let conn = null, me = '', D = null, dataAt = 0, online = navigator.onLine, lastErr = '', Q = [];
  let view = ls.get('cx-view') || 'prehled', ufilter = ls.get('cx-uf') || 'moje';
  // pozvaný „jen nahlíží“: vidí stavbu, nic neposílá ani nemění (server mu změny stejně nepřijme)
  let ro = ls.get('cx-ro') === '1';
  const setRo = v => { ro = !!v; ls.set('cx-ro', ro ? '1' : ''); document.body.classList.toggle('ro', ro); if (ro) { view = 'prehled'; ufilter = 'vse'; } };
  const F = {photos: [], to: new Set(), info: false, end: addD(todayS(), 7), obj: new Set(), text: '', result: null};

  function toast(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 3200); }

  /* ---------- data z programu ---------- */
  const eff = t => { const d = Number(t.done) || 0; if (t.status === 'done' || d >= 100) return 'done'; if (t.status === 'hold') return 'hold'; if (t.end && t.end < todayS()) return 'late'; if (d > 0 || t.status === 'doing') return 'doing'; if (t.kind !== 'simple' && !t.src && t.start && t.start < todayS()) return 'late'; return 'todo'; };
  const tasks = () => (D && D.tasks) || [];
  const simple = () => tasks().filter(t => t.kind === 'simple');
  // sledované úkoly jako v programu pro počítač: úkoly do harmonogramu + úkoly ze zápisů z porad
  const tracked = () => { const z = new Set(); ((D && D.diary) || []).forEach(e => { if (e.kind === 'porada') Object.values(e.added || {}).forEach(id => z.add(id)); }); return tasks().filter(t => t.kind !== 'simple' || (z.has(t.id) && !t.info)); };
  const people = t => [t.owner || '', ...(t.team || [])].filter(Boolean);
  const isMe = n => !!me && fold(n) === fold(me);
  const mine = t => people(t).some(isMe);
  const team = () => {
    const p = (D && D.project) || {};
    const list = Array.isArray(p.team) ? p.team : [];
    const extra = p.peopleV2 ? [] : tasks().flatMap(people);
    return [...new Set([...list, ...extra])].filter(n => n && n !== 'Bez přiřazení').sort((a, b) => a.localeCompare(b, 'cs'));
  };
  const projShort = () => { const n = String((D && D.project && D.project.name) || 'Stavba'); return n.split(',')[0].replace(/^Rekonstrukce( objektu)?\s*/i, '') || n; };

      <div class="objs">${'ABCDEFG'.split('').map(c => `<button type="button" class="obj" data-obj="${c}" aria-pressed="${F.obj.has(c)}">${c}</button>`).join('')}</div>
      <p class="lbl">Co je potřeba</p>
      <div class="txt"><textarea id="f-text" placeholder="Napište nebo klepněte na mikrofon">${esc(F.text)}</textarea><button type="button" class="mic" id="f-mic" aria-label="Nadiktovat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div>
      ${rec ? '' : '<p class="hint">Diktovat jde i mikrofonem na klávesnici: klepněte do textu a pak na ikonu mikrofonu.</p>'}
      <div class="sendbar"><button type="button" class="send" id="f-send" ${n && (F.photos.length || F.text.trim()) ? '' : 'disabled'}><i>➜</i>Odeslat</button><div class="sum" id="f-sum">${esc(sum)}</div></div>
    </main>`;
  }

  /* ---------- akce ---------- */
  function bind() {
    const v = $('#view');
    v.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
    v.querySelectorAll('[data-uf]').forEach(b => b.onclick = () => { ufilter = b.dataset.uf; ls.set('cx-uf', ufilter); render(); });
    v.querySelectorAll('[data-done]').forEach(b => b.onclick = e => { e.stopPropagation(); markDone(b.dataset.done); });
    v.querySelectorAll('.task[data-t]').forEach(c => c.onclick = () => detail(c.dataset.t));
    v.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act));
    if (view !== 'hlaseni' || F.result) return;
    v.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { F.photos.splice(+b.dataset.rm, 1); render(); });
    v.querySelectorAll('[data-to]').forEach(b => b.onclick = () => { const n = b.dataset.to; F.to.has(n) ? F.to.delete(n) : F.to.add(n); render(); });
    const all = v.querySelector('[data-all]'); if (all) all.onclick = () => { const on = all.getAttribute('aria-pressed') !== 'true'; F.to = new Set(on ? team() : []); render(); };
    v.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { F.info = b.dataset.kind === 'info'; render(); });
    v.querySelectorAll('[data-end]').forEach(b => b.onclick = () => { F.end = addD(todayS(), +b.dataset.end); render(); });
    v.querySelectorAll('[data-obj]').forEach(b => b.onclick = () => { const c = b.dataset.obj; F.obj.has(c) ? F.obj.delete(c) : F.obj.add(c); b.setAttribute('aria-pressed', F.obj.has(c)); });
    const end = $('#f-end'); if (end) end.onchange = () => { F.end = end.value; };
    const tx = $('#f-text'); tx.oninput = () => { F.text = tx.value; $('#f-send').disabled = !(F.to.size && (F.photos.length || F.text.trim())); };
    $('#f-mic').onclick = dictate;
    $('#f-send').onclick = send;
  }
  async function act(a) {
    if (a === 'cam') $('#in-cam').click();
    else if (a === 'gal') $('#in-gal').click();
    else if (a === 'again') { F.result = null; render(); }
    else if (a === 'pump') { kick(); toast(online ? 'Odesílám…' : 'Bez signálu, odešle se později.'); }
    else if (a === 'install' && installEvt) { installEvt.prompt(); installEvt = null; render(); }
    else if (a === 'settings') settings();
  }
  async function onFiles(files) {
    const arr = [...files].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|heic|heif|webp)$/i.test(f.name));
    if (!arr.length) return;
    toast(arr.length === 1 ? 'Zpracovávám fotku…' : `Zpracovávám ${arr.length} fotky…`);
    for (const f of arr) { try { F.photos.push(await shrink(f)); } catch (e) { toast('Fotku se nepodařilo načíst. Zkuste ji vyfotit znovu.'); } }
    if (view !== 'hlaseni') view = 'hlaseni';
    render();
  }
  $('#in-cam').onchange = e => { onFiles(e.target.files); e.target.value = ''; };
  $('#in-gal').onchange = e => { onFiles(e.target.files); e.target.value = ''; };
  async function shrink(file) {
    let src, w, h;
    try { src = await createImageBitmap(file, {imageOrientation: 'from-image'}); w = src.width; h = src.height; }
    catch (e) { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); w = src.naturalWidth; h = src.naturalHeight; }
    const draw = (max, q) => { const s = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', q); };
    const big = draw(1600, .74), thumb = draw(240, .6);
    return {b64: big.split(',')[1], thumb};
  }
  let recog = null;
  function dictate() {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition, mic = $('#f-mic'), tx = $('#f-text');
    if (!R) { tx.focus(); toast('Klepněte na mikrofon na klávesnici a mluvte.'); return; }
    if (recog) { recog.stop(); return; }
    recog = new R(); recog.lang = 'cs-CZ'; recog.interimResults = true; recog.continuous = true;
    const base = tx.value ? tx.value.replace(/\s*$/, ' ') : '';
    recog.onresult = e => { let s = ''; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; tx.value = base + s; F.text = tx.value; $('#f-send').disabled = !(F.to.size && (F.photos.length || F.text.trim())); };
    recog.onerror = e => { toast(e.error === 'not-allowed' ? 'Telefon nepovolil mikrofon. Použijte mikrofon na klávesnici.' : e.error === 'network' ? 'Diktování teď potřebuje signál. Použijte mikrofon na klávesnici.' : 'Diktování se přerušilo.'); };
    recog.onend = () => { recog = null; mic.classList.remove('on'); };
    try { recog.start(); mic.classList.add('on'); } catch (e) { recog = null; }
  }
  async function send() {
    if (!F.to.size) { toast('Vyberte, komu hlášení patří.'); return; }
    const cid = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const it = {cid, kind: 'report', at: new Date().toISOString(), day: todayS(), by: me, to: [...F.to].sort((a, b) => a.localeCompare(b, 'cs')), info: F.info, end: F.info ? '' : F.end, obj: [...F.obj].sort().join(''), text: F.text.trim(), photos: F.photos, att: [], state: 'wait'};
    try { await CXQ.put(it); } catch (e) { toast('Hlášení se nepodařilo uložit do telefonu. Zkuste to znovu.'); return; }
    const n = it.to.length, all = team().length && it.to.length === team().length;
    const msg = it.info ? `${all ? 'Všichni' : it.to.join(', ')}: informace je v programu a odešel e-mail.` : n === 1 ? `${it.to[0]} má nový úkol v programu a dostal e-mail.` : `${all ? 'Všichni' : it.to.join(', ')}: každý má svůj úkol v programu a dostal e-mail.`;
    F.photos = []; F.to = new Set(); F.text = ''; F.obj = new Set(); F.info = false; F.end = addD(todayS(), 7);
    F.result = {cid, sent: false, msg};
    await loadQ(); render(); kick();
  }
  async function markDone(id) {
    const t = tasks().find(x => x.id === id); if (!t) return;
    const now = new Date().toISOString(), ts = Date.now();
    const nt = Object.assign({}, t, {status: 'done', done: 100, doneAt: now, doneBy: me, updatedAt: now, updatedBy: me, _ts: ts});
    const lg = {id: 'l' + ts.toString(36) + Math.random().toString(36).slice(2, 6), taskId: id, at: now, by: me, done: 100, status: 'done', comment: 'Splněno (z telefonu)', title: t.title, _ts: ts};
    D.tasks = tasks().map(x => x.id === id ? nt : x); D.log = (D.log || []).concat(lg);
    dataAt = Date.now(); await CXQ.kvSet('data', {rev: 0, data: D, at: dataAt}).catch(() => {});
    await CXQ.put({cid: 'u' + ts.toString(36), kind: 'upd', at: now, data: {tasks: [nt], log: [lg]}, state: 'wait'});
    toast('Splněno: ' + t.title); closeSheet(); await loadQ(); render(); kick();
  }

  /* ---------- okna ---------- */
  function sheet(html) {
    const o = $('#overlay'); o.hidden = false;
    o.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true"><span class="grab"></span>${html}</div>`;
    o.querySelector('.scrim').onclick = closeSheet;
    return o.querySelector('.sheet');
  }
  function closeSheet() { const o = $('#overlay'); o.hidden = true; o.innerHTML = ''; }
  function detail(id) {
    const t = tasks().find(x => x.id === id); if (!t) return;
    const st = eff(t), att = t.att || [], canDone = !ro && !t.info && t.kind === 'simple' && st !== 'done' && (mine(t) || !t.owner);
    const s = sheet(`<h3>${esc(t.title)}</h3>
      ${att.length ? `<div class="big-ph" style="display:flex;flex-direction:column;gap:8px">${att.map(a => `<a href="${esc(a.url || thumbOf(a))}" target="_blank" rel="noopener"><img src="${esc(thumbOf(a))}" alt="Fotka ze stavby"></a>`).join('')}</div>` : ''}
      <div class="kv"><span>${t.info ? 'Pro' : 'Komu'}</span><b>${esc(people(t).join(', ') || 'Bez přiřazení')}</b>
        <span>Zadal</span><span style="color:var(--ink)">${esc(t.createdBy || '—')} · ${fmtT(t.createdAt) || fmtDY(t.start)}</span>
        ${t.info ? '' : `<span>Termín</span><span style="color:${st === 'late' ? 'var(--red)' : 'var(--ink)'}">${t.end ? fmtDY(t.end) : 'bez termínu'}</span>`}
        ${t.obj ? `<span>Objekt</span><span style="color:var(--ink)">${esc(t.obj)}</span>` : ''}
        <span>Stav</span><span style="color:var(--ink)">${t.info ? 'Na vědomí' : st === 'done' ? `Splněno ${t.doneBy ? '· ' + esc(t.doneBy) : ''}` : st === 'late' ? 'Po termínu' : 'Nesplněno'}</span></div>
      ${t.missed && st !== 'done' ? `<div class="banner">Důvod nesplnění: ${esc(t.missed)}</div>` : ''}
      <div class="acts">${canDone ? `<button type="button" class="done-btn" data-done="${esc(t.id)}">✓ Splněno</button>` : ''}<button type="button" class="big" data-close>Zavřít</button></div>
      ${!t.info && st !== 'done' && !canDone ? `<p class="hint">Splnění potvrzuje ${esc(people(t).join(', '))}.</p>` : ''}`);
    s.querySelectorAll('[data-done]').forEach(b => b.onclick = () => markDone(b.dataset.done));
    s.querySelector('[data-close]').onclick = closeSheet;
  }
  function settings() {
    const s = sheet(`<h3>Nastavení</h3>
      <div class="kv"><span>Jméno</span><b>${esc(ro ? (ls.get('cx-ro-name') || me || '') + ' · jen prohlížení' : me)}</b><span>Stavba</span><span style="color:var(--ink)">${esc(projShort())}</span>
        <span>Spojení</span><span style="color:var(--ink)">${online && !lastErr ? 'v pořádku' : esc(lastErr === 'OFFLINE' || !online ? 'bez signálu' : lastErr)}</span><span>Verze</span><span style="color:var(--ink)">Constructo mobil ${VERSION}</span></div>
      <div class="acts"><button type="button" class="big" id="st-name">Změnit jméno</button><button type="button" class="big" id="st-ref">Načíst znovu</button></div>
      <div class="acts"><button type="button" class="big" id="st-off" style="color:var(--red)">Odpojit telefon</button><button type="button" class="big pri" data-close>Hotovo</button></div>`);
    s.querySelector('[data-close]').onclick = closeSheet;
    $('#st-name').hidden = ro;
    $('#st-name').onclick = () => { closeSheet(); setupName(); };
    $('#st-ref').onclick = async () => { toast('Načítám…'); const ok = await refresh(); toast(ok ? 'Načteno' : 'Bez spojení'); closeSheet(); };
    const off = $('#st-off'); off.onclick = async () => {
      if (!off.dataset.arm) { off.dataset.arm = 1; off.textContent = 'Opravdu odpojit?'; return; }
      await CXQ.kvSet('conn', null); await CXQ.kvSet('data', null); conn = null; D = null; setRo(false); closeSheet(); setupCode();
    };
  }

  boot();
})();
</script>
