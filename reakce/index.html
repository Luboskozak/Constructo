<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-hashes' 'sha256-i1ZA9mDHmmkbzxBj2mD219yiPZ4GWIu6RpCXjmzAeGE='; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Zpráva v kolektivu · Constructo</title>
<meta name="theme-color" content="#131518">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap">
<style>
/* Constructo: reakce kolegy na zprávu v kolektivu (jen tato jedna zpráva, nic jiného ze stavby) */
:root{
  --y:#F4D23C; --y2:#FFF4BF; --k:#131518; --bg:#f4f4f1; --card:#fff; --ink:#16191c; --mut:#6b7279; --line:#e4e4df;
  --red:#b3261e; --red2:#fdeae6; --grn:#2f8a52; --grn2:#dcefe3;
  --f:"Hanken Grotesk","Helvetica Neue",Arial,system-ui,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #2b6cb0;outline-offset:2px}
.head{background:var(--k);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 0;border-bottom:6px solid var(--y)}
.head .in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.logo{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:300}
.logo svg{height:20px;width:auto;fill:#FAD805}
.head h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.head p{margin:0;color:#c9ced3;font-size:14px}
main{max-width:720px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 1px 0 var(--line)}
.card h2{margin:0 0 10px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.card h2::before{content:"";width:6px;height:22px;background:var(--y);border-radius:2px}
.card h2.red{color:var(--red)}
.sum{font-size:15px}.sum b.r{color:var(--red)}
.it{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .d{font-weight:800;font-size:14px}.it.po .d{color:var(--red)}
.it .d small{display:block;font-weight:500;font-size:12px;color:var(--mut)}.it.po .d small{color:var(--red)}
.it .t{font-weight:600}.it .t small{display:block;font-weight:400;font-size:13px;color:var(--mut)}
.nic{color:var(--grn);font-weight:700;margin:0}
.ok{background:var(--grn2);color:#1d5e37;border-radius:14px;padding:16px 18px;font-weight:600;font-size:17px}
.ok b{display:block;font-size:20px;margin-bottom:4px}
.send{width:100%;border:0;border-radius:14px;background:var(--y);color:var(--k);font-size:20px;font-weight:800;padding:18px}
.send:disabled{opacity:.55}
.hint{color:var(--mut);font-size:14px;margin:8px 0 0;text-align:center}
.err{color:var(--red);font-weight:600;margin:10px 0 0;text-align:center}
.big{text-align:center;padding:40px 18px}.big b{display:block;font-size:19px;margin-bottom:6px}
footer{max-width:720px;margin:0 auto;padding:0 16px 30px;color:var(--mut);font-size:12.5px;text-align:center}

.pill{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;padding:5px 12px;border-radius:20px;background:var(--y);color:var(--k)}
.pill.ukol{background:var(--grn2);color:#1d5e37}
.meta{color:var(--mut);font-size:14px;margin:8px 0 0}
.txt{white-space:pre-wrap;font-size:16px;line-height:1.55;margin:12px 0 0}
.fotky{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.fotky img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--bg)}
.lnk{display:inline-block;margin-top:12px;font-weight:700;color:var(--k)}
.kdo{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.kdo button{border:2px solid var(--line);background:#fff;border-radius:22px;padding:9px 14px;font-weight:600}
.kdo button[aria-pressed="true"]{border-color:var(--k);background:var(--y2);font-weight:800}
.send.sec{background:#fff;border:2px solid var(--k);font-size:18px;margin-top:10px}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;margin-top:8px}
.r{padding:9px 0;border-top:1px solid var(--line)}.r:first-of-type{border-top:0}
.r b{font-weight:800}.r small{color:var(--mut);display:block;font-size:13px}.r p{margin:4px 0 0;white-space:pre-wrap}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <symbol id="cx-mark" viewBox="190 130 516 310"><path d="M498.35 265.33A154.8 154.8 0 1 0 498.35 304.67L430.02 304.67A87.46 87.46 0 1 1 430.02 265.33ZM445.2 172.19A151.02 151.02 0 0 1 484.72 228.17A87.46 87.46 0 1 1 484.72 341.83A151.02 151.02 0 0 1 445.2 397.81A154.8 154.8 0 1 0 445.2 172.19Z"/></symbol>
</defs></svg>
<header class="head"><div class="in">
  <div class="logo"><svg viewBox="0 0 516 310" aria-hidden="true"><use href="#cx-mark"/></svg>Constructo</div>
  <h1 id="h1">Zpráva v kolektivu</h1>
  <p id="sub">Načítám zprávu…</p>
</div></header>
<main id="main"><div class="card big"><b>Načítám zprávu…</b>Chvilku strpení.</div></main>
<footer>Tato stránka ukazuje jen tuto jednu zprávu. Odkaz nikomu dalšímu neposílejte.<br>Constructo · Developed by Luboš Kozák</footer>
<script>
(() => {
  'use strict';
  const API = "https://script.google.com/macros/s/AKfycbwJCT7cNtZyKrk21RItnIu4qu2SsSPhNyYdsbIJ5d8Q91esVBEVe82724ufLctboJb4/exec";
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const kdy = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('cs-CZ', {day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Prague'}); };
  const den = s => s ? s.split('-').reverse().map(Number).join('. ') : '';
  const ls = {get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }};
  let h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (!h && window.ZKOUSKA_HASH) h = window.ZKOUSKA_HASH;
  const tecka = h.lastIndexOf('.'), z = tecka > 0 ? h.slice(0, tecka) : '', t = tecka > 0 ? h.slice(tecka + 1) : '';
  let P = null, kdo = ls.get('cx-reakce-kdo'), posilam = false, chyba = '', hotovo = '', psat = false;
  const CO = {vedomi: 'Beru na vědomí', splneno: 'Splněno', odpoved: 'Odpověď'};

  async function call(o) {
    if (typeof window.ZKOUSKA_API === 'function') return window.ZKOUSKA_API(o);
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 60000);
    try {
      const r = await fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(o), redirect: 'follow', signal: ctl.signal});
      return await r.json();
    } finally { clearTimeout(tm); }
  }
  function hlaska(nadpis, text) {
    $('#sub').textContent = 'Zprávu se nepodařilo otevřít';
    $('#main').innerHTML = `<div class="card big"><b>${esc(nadpis)}</b>${esc(text)}</div>`;
  }
  async function nacti() {
    if (!z || t.length !== 22) return hlaska('Odkaz není celý.', 'Otevřete prosím odkaz znovu přímo z e-mailu.');
    let r;
    try { r = await call({akce: 'kolega_zprava', z, t}); } catch (e) { return hlaska('Spojení se nepodařilo.', 'Zkontrolujte připojení k internetu a stránku obnovte.'); }
    if (r && r.zprava) { P = r.zprava; if (kdo && !lidi().includes(kdo)) kdo = ''; if (!kdo && lidi().length === 1) kdo = lidi()[0]; return kresli(); }
    if (r && r.error === 'nenalezeno') return hlaska('Zprávu jsme nenašli.', 'Možná byla v Constructu smazaná, nebo odkaz není celý.');
    hlaska('Zprávu se nepodařilo otevřít.', (r && r.error) || 'Zkuste to prosím později.');
  }
  const lidi = () => (P.komu || []).filter(Boolean);
  function kresli() {
    $('#h1').textContent = P.info ? 'Na vědomí' : 'Úkol';
    $('#sub').textContent = `od ${P.by || 'kolegy'} · ${P.stavba || 'Stavba'}`;
    const moje = P.reakce.filter(o => o.jmeno === kdo), uzSplneno = !P.info && (P.hotovo || []).includes(kdo);
    const tl = !kdo ? '<p class="hint" style="text-align:left;margin:0">Nejdřív klepněte na své jméno.</p>'
      : `${hotovo ? `<div class="ok"><b>✓ Děkujeme, odesláno.</b>${esc(hotovo)} ${esc(P.by || 'Odesílatel')} to uvidí v Constructu a přijde mu e-mail.</div>` : ''}
        ${!P.info && !uzSplneno ? `<button type="button" class="send" data-st="splneno"${posilam ? ' disabled' : ''}>✓ Splněno</button>` : ''}
        ${!P.info && uzSplneno ? '<div class="ok"><b>✓ Úkol je splněný.</b></div>' : ''}
        <button type="button" class="send${P.info ? '' : ' sec'}" data-st="vedomi"${posilam ? ' disabled' : ''}>${moje.some(o => o.stav === 'vedomi') ? '✓ Beru na vědomí (už potvrzeno)' : '✓ Beru na vědomí'}</button>
        <button type="button" class="send sec" id="psat"${posilam ? ' disabled' : ''}>✎ Odpovědět / doplnit poznámku</button>
        ${psat ? `<textarea id="txt" placeholder="Napište odpověď, poznámku nebo co je potřeba upravit…"></textarea><button type="button" class="send" data-st="odpoved"${posilam ? ' disabled' : ''}>Odeslat odpověď</button>` : ''}
        ${posilam ? '<p class="hint">Odesílám…</p>' : ''}${chyba ? `<p class="err">${esc(chyba)}</p>` : ''}`;
    $('#main').innerHTML = `<div class="card"><span class="pill${P.info ? '' : ' ukol'}">${P.info ? 'NA VĚDOMÍ' : 'ÚKOL'}</span>
        <p class="meta">${esc(kdy(P.at))} · zapsal ${esc(P.by || '–')}${P.obj ? ' · objekt ' + esc(P.obj) : ''}${P.end ? ' · <b>splnit do ' + esc(den(P.end)) + '</b>' : ''}</p>
        <div class="txt">${esc(P.text)}</div>
        ${P.fotky.length ? `<div class="fotky">${P.fotky.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener"><img src="${esc(f.thumb || f.url)}" alt="Fotka ze stavby" loading="lazy"></a>`).join('')}</div>` : ''}
        ${P.pdf ? `<a class="lnk" href="${esc(P.pdf)}" target="_blank" rel="noopener">Otevřít formulář PDF →</a>` : ''}</div>
      <div class="card"><h2>Kdo jste?</h2><div class="kdo">${lidi().map(n => `<button type="button" data-kdo="${esc(n)}" aria-pressed="${n === kdo}">${esc(n)}</button>`).join('')}</div></div>
      <div class="card">${tl}</div>
      ${P.reakce.length ? `<div class="card"><h2>Reakce</h2>${P.reakce.map(o => `<div class="r"><b>${esc(o.jmeno)}: ${esc(CO[o.stav] || o.stav)}</b><small>${esc(kdy(o.at))}</small>${o.text ? `<p>${esc(o.text)}</p>` : ''}</div>`).join('')}</div>` : ''}`;
    document.querySelectorAll('[data-kdo]').forEach(b => b.onclick = () => { kdo = b.dataset.kdo; ls.set('cx-reakce-kdo', kdo); hotovo = ''; chyba = ''; kresli(); });
    document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => posli(b.dataset.st));
    const ps = $('#psat'); if (ps) ps.onclick = () => { psat = true; kresli(); const x = $('#txt'); if (x) x.focus(); };
  }
  async function posli(stav) {
    if (posilam || !kdo) return;
    const x = $('#txt'), text = x ? x.value.trim() : '';
    if (stav === 'odpoved' && !text) { chyba = 'Napište prosím odpověď.'; return kresli(); }
    posilam = true; chyba = ''; hotovo = ''; kresli();
    try {
      const r = await call({akce: 'kolega_odpoved', z, t, kdo, stav, text: stav === 'odpoved' ? text : '', cid: Date.now().toString(36) + Math.random().toString(36).slice(2, 6)});
      if (r && r.zprava) { P = r.zprava; hotovo = stav === 'splneno' ? 'Úkol je označený jako splněný.' : stav === 'vedomi' ? 'Potvrzeno: berete na vědomí.' : 'Vaše odpověď je uložená.'; psat = false; }
      else chyba = (r && r.error) || 'Nepodařilo se odeslat, zkuste to prosím znovu.';
    } catch (e) { chyba = 'Bez spojení. Zkontrolujte internet a zkuste to znovu.'; }
    posilam = false; kresli();
  }
  nacti();
})();
</script>
</body>
</html>
