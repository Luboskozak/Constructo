<style>
:root{--bg:#f4f4f1;--panel:#ffffff;--ink:#16191c;--muted:#6b7279;--line:#e4e4df;--soft:#efefeb;--accent:#F4D23C;--accent-ink:#16191c;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;font-size:14.5px}
.hl-top{display:flex;align-items:center;gap:12px;background:#131518;color:#fff;padding:10px 18px}
.hl-top svg{width:44px;height:27px;fill:#F4D23C}.hl-top b{font-size:18px;font-weight:600}.hl-top span{color:#bbb}
.hl-top a{margin-left:auto;color:#F4D23C;font-weight:700;text-decoration:none}
body.vlozeno .hl-top{display:none}
main{padding:18px 22px 40px;max-width:1500px;margin:0 auto}
h1{margin:0 0 12px;font-size:26px;font-weight:800}
.nepripojeno{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;max-width:680px;line-height:1.55}
.nepripojeno a{color:#16191c;font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16191c;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:4000;display:none;max-width:calc(100% - 32px)}
.ver{color:var(--muted);font-size:12px;margin-top:18px}
</style>
