/* Constructo Docházka: pracovník firmy potvrzuje Příchod / Pauzu / Odchod. Poloha jen v okamžiku potvrzení. */
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--f)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blu);outline-offset:2px}

.logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:300}
.logo svg{height:19px;width:auto;fill:#FAD805}
.logo b{margin-left:auto;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--y)}
.jaz{display:flex;flex:none;border:2px solid var(--y);border-radius:999px;overflow:hidden;margin-left:10px;padding:0;background:none}
.jaz span{padding:7px 13px;font-size:15px;font-weight:900;color:#fff;letter-spacing:.03em}
.jaz span.on{background:var(--y);color:var(--k)}

.head h1{margin:4px 0 0;font-size:26px;font-weight:900;letter-spacing:-.01em;line-height:1.15}
.head p{margin:0;color:#c9ced3;font-size:15px}

.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 0 var(--line)}
.card h2{margin:0 0 10px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px}
.card h2::before{content:"";width:6px;height:22px;background:var(--y);border-radius:2px;flex:none}
.card p{margin:0 0 10px}
.stav{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:var(--card);box-shadow:0 1px 0 var(--line)}
.stav .dot{width:18px;height:18px;border-radius:50%;background:#c4c7c2;flex:none}
.stav.prace .dot{background:var(--grn);box-shadow:0 0 0 6px var(--grn2)}
.stav.pauza .dot{background:#e0a400;box-shadow:0 0 0 6px var(--y2)}
.stav b{display:block;font-size:21px;font-weight:900;line-height:1.2}
.stav small{color:var(--mut);font-size:15px}
.tl{display:flex;flex-direction:column;gap:12px}
.tl button{width:100%;border:0;border-radius:20px;padding:22px 18px;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:14px;min-height:92px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.tl button svg{width:34px;height:34px;flex:none}
.tl .b-prichod,.tl .b-konec{background:var(--grn);color:#fff}
.tl .b-pauza{background:var(--y);color:var(--k)}
.tl .b-odchod{background:var(--k);color:#fff}
.tl button.mini{min-height:64px;padding:14px 18px;font-size:21px;background:#fff;color:var(--k);border:2px solid var(--k);box-shadow:none}
.tl button.mini svg{width:26px;height:26px}
.tl .napoveda{text-align:center;color:var(--mut);font-size:15px;margin:-4px 0 0}
.ok-big{width:84px;height:84px;border-radius:50%;background:var(--grn);color:#fff;display:grid;place-items:center;font-size:52px;font-weight:900;margin:0 auto 6px}
.sheet.cent{text-align:center}
.pikto{position:fixed;inset:0;z-index:70;background:#131518;color:#fff;display:flex;flex-direction:column;align-items:center;gap:10px;height:100vh;height:100dvh;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(58px + env(safe-area-inset-bottom,0px))}

.pk-vid span{width:34px;height:34px;border-radius:50%;background:var(--k);color:var(--y);display:grid;place-items:center;font-size:16px;padding-left:3px}
.pk-kroky{flex:1;min-height:0;width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px}
.pk-k{flex:1;min-height:0;display:flex;align-items:center;gap:10px;width:100%}
.pk-k .n{width:38px;height:38px;border-radius:50%;background:var(--y);color:var(--k);display:grid;place-items:center;font-weight:900;font-size:20px;flex:none}
.pk-t{flex:1;height:100%;max-height:120px;min-height:0;display:flex;align-items:center;gap:14px;background:#fff;color:#111;border-radius:18px;padding:6px 14px;text-decoration:none;overflow:hidden}
.pk-t svg{height:min(52px,70%);width:auto;flex:none;pointer-events:none}
.pk-t small{font-size:20px;font-weight:800}
.pk-go{box-shadow:0 0 0 4px var(--y);animation:pul 1.3s infinite}
@keyframes pul{50%{box-shadow:0 0 0 9px rgba(244,210,60,.35)}}
.pk-lista{position:relative;display:block;width:100%;max-width:330px}.pk-lista img{display:block;width:100%;height:auto}
.pk-lista i{position:absolute;left:27%;top:50%;width:14%;aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid #F4A20C;border-radius:50%;animation:pul2 1s infinite}
@keyframes pul2{50%{transform:translate(-50%,-50%) scale(1.18)}}
.vidbg{position:fixed;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center}
.vidbg video{width:100%;height:100%;object-fit:contain;background:#000}
.vidbg button{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:56px;height:56px;border-radius:50%;border:0;background:#fff;font-size:26px;font-weight:900;z-index:2}
.pk-sip{position:fixed;font-size:52px;line-height:1;color:var(--y);font-weight:900;animation:nah 1s infinite;text-shadow:0 0 8px #000}
.ikbtn{display:flex;align-items:center;gap:14px;width:100%;border:3px solid #F4A20C;background:#fff4d6;border-radius:18px;padding:14px 16px;font-size:20px;font-weight:800;text-align:left;color:var(--k)}

.odk{border:0;background:none;color:var(--mut);text-decoration:underline;font-size:15px;padding:10px;align-self:center}

.mut{color:var(--mut);font-size:14.5px}
.big{width:100%;border:0;border-radius:16px;background:var(--y);color:var(--k);font-size:20px;font-weight:800;padding:17px;margin-top:6px}

.big.ok{background:var(--grn);color:#fff}

.err{color:var(--red);font-weight:700;margin:10px 0 0}
.lidi{display:flex;flex-direction:column;gap:8px}
.lidi h3{margin:10px 0 2px;font-size:14px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}

.ios-s .n{width:34px;height:34px;border-radius:50%;background:var(--k);color:#fff;display:grid;place-items:center;font-weight:900;font-size:17px}
.ios-s p{margin:4px 0 0;font-size:16px;line-height:1.35}
.ios-s svg{display:block;width:100%;height:auto;margin-top:8px;border-radius:12px;pointer-events:none;opacity:.85}
.obr{display:block;font-size:12px;color:var(--mut);margin-top:3px}

.ikona img{width:62px;height:62px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.2)}

.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:22px 18px calc(90px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.sheet h3{margin:0 0 4px;font-size:24px;font-weight:900}

.fronta{background:var(--y2);border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px}
footer{max-width:560px;margin:0 auto;padding:0 16px 30px;color:var(--mut);font-size:12.5px;text-align:center}
footer button{border:0;background:none;color:var(--mut);text-decoration:underline;font-size:12.5px;padding:6px}

  async function volej(o, ms) {
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms || 25000);

  /* ---------- fronta: záznam se uloží hned do telefonu a odešle, až je signál ---------- */

  /* ---------- poloha jen v okamžiku potvrzení ---------- */
  function poloha() {
    return new Promise(res => {
      if (!navigator.geolocation) return res({chyba: 'telefon neumí'});
      let hotovo = false;
      const konec = v => { if (!hotovo) { hotovo = true; res(v); } };
      setTimeout(() => konec({chyba: 'nezjištěna včas'}), 12000);
      navigator.geolocation.getCurrentPosition(p => konec({lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy}),

    });

    sh.querySelector('#i-ok').onclick = () => { sh.remove(); vykresli(); };
    const kp = sh.querySelector('#i-kop');
    if (kp) kp.onclick = async () => { try { await navigator.clipboard.writeText(location.href); kp.textContent = T.kopOk; } catch (e) { prompt(T.kopP, location.href); } };
  }

  /* ---------- QR kód stavby: pracovník si jednou vybere své jméno ---------- */
  let QRL = null, QRvyb = '';
  async function qrVyber() {
    $('#h1').textContent = T.qrH;
    if (!QRL) {
      $('#sub').textContent = T.nacitam;
      const r = await volej({sid: QR.s, qr: QR.q});
      if (!r || !r.ok) { $('#sub').textContent = ''; $('#main').innerHTML = '<div class="card"><h2>' + T.nejde + '</h2><p>' + (r && r.error === 'offline' ? T.offline : T.qrNeplati) + '</p><button type="button" class="big" id="q-zn">' + T.zkusit + '</button></div>'; $('#q-zn').onclick = qrVyber; return; }
      QRL = r;
    }
    $('#sub').textContent = QRL.stavba || '';
    const po = {};
    QRL.lidi.forEach(x => { (po[x.firma || T.bezFirmy] = po[x.firma || T.bezFirmy] || []).push(x); });
    const firmy = Object.keys(po).sort((a, b) => a.localeCompare(b, 'cs'));
    $('#main').innerHTML = '<div class="card"><h2>' + T.kdo + '</h2><p>' + T.kdoTxt + '</p>' +
      (QRL.lidi.length > 8 ? '<input type="search" id="q-hl" placeholder="' + esc(T.hledat) + '" autocomplete="off">' : '') +
      '<div class="lidi" id="q-l">' + (firmy.length ? firmy.map(f => '<h3>' + esc(f) + '</h3>' + po[f].sort((a, b) => a.jmeno.localeCompare(b.jmeno, 'cs')).map(x => '<button type="button" data-k="' + esc(x.kid) + '" data-h="' + esc((x.jmeno + ' ' + f).toLowerCase()) + '">' + esc(x.jmeno) + (x.funkce ? '<small>' + esc(x.funkce) + '</small>' : '') + '</button>').join('')).join('')
        : '<p>' + T.prazdno + '</p>') + '</div>' +
      '<p class="mut" style="margin-top:12px">' + T.neniSez + '</p></div>';
    const hl = $('#q-hl');
    if (hl) hl.oninput = () => { const q = hl.value.trim().toLowerCase(); $('#q-l').querySelectorAll('button').forEach(b => { b.hidden = q && !b.dataset.h.includes(q); }); };
    $('#q-l').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const x = QRL.lidi.find(y => y.kid === b.dataset.k);
      const sh = sheet('<h3>' + esc(T.jste(x.jmeno)) + '</h3><p>' + esc([x.firma, x.funkce].filter(Boolean).join(' · ')) + '</p><button type="button" class="big ok" id="q-ano">' + T.ano + '</button><button type="button" class="big sec" id="q-ne">' + T.ne + '</button>');
      sh.querySelector('#q-ne').onclick = () => sh.remove();
      sh.querySelector('#q-ano').onclick = async () => {
        const bb = sh.querySelector('#q-ano'); bb.disabled = true; bb.textContent = T.ukl;
        const r = await volej({sid: QR.s, qr: QR.q, kid: x.kid});
        if (!r || !r.ok) { bb.disabled = false; bb.textContent = T.zkusit; return; }
        JA = {s: QR.s, k: x.kid, t: r.tok};
        ls.set('cx-doch', JSON.stringify(JA));
        STAV = {dnes: [], jmeno: x.jmeno, firma: x.firma, funkce: x.funkce, stavba: QRL.stavba}; ulozStav();
        history.replaceState(null, '', osobniAdresa());
        sh.remove(); vykresli(); odesli();
      };
    });
  }

  function vykresli(zprava) {
    if (QR && !JA) return qrVyber();
    if (QR && JA && JA.s !== QR.s) return qrVyber();
    if (!JA) {
      $('#h1').textContent = 'Docházka'; $('#sub').textContent = 'Constructo';
      $('#main').innerHTML = '<div class="card"><h2>' + T.jak + '</h2><p>' + (standalone() ? T.ikonaBez : T.jakTxt) + '</p></div>';
      return;
    }
    if (chyba === 'odkaz' || chyba === 'konec') {
      $('#main').innerHTML = '<div class="card"><h2>' + (chyba === 'konec' ? T.konecT : T.odkazT) + '</h2><p>' + (chyba === 'konec' ? T.konecP : T.odkazP) + '</p><button type="button" class="big sec" id="b-odhl">' + T.znovu + '</button></div>';
      $('#b-odhl').onclick = odhlasit;
      return;
    }
    // 1.4 (Luboš): při prvním otevření odkazu nejdřív JEN ikona na plochu; docházka funguje až z ikony
    const kind = browserKind();
    if (!standalone() && /android|iphone|ipad|ipod/i.test(navigator.userAgent) && !ls.get('cx-doch-bez') && (installEvt || /^ios-(safari|inapp)$/.test(kind) || /android/i.test(navigator.userAgent))) {
      $('#h1').textContent = STAV.jmeno || 'Docházka';
      $('#main').innerHTML = '';
      return navodPlocha(true);
    }
    if (!ls.get('cx-doch-souhlas')) return souhlas();
    hlavni(zprava);
  }
  function odhlasit() {
    if (fronta().length && !confirm(T.odhlOt)) return;
    ['cx-doch', 'cx-doch-stav', 'cx-doch-fronta'].forEach(ls.del);
    JA = null; chyba = ''; history.replaceState(null, '', location.pathname); vykresli();
  }
  function paticka() {
    $('#foot').innerHTML = 'Constructo Docházka ' + VERZE + ' · Developed by Luboš Kozák<br><button type="button" id="b-gdpr">' + T.gdpr + '</button> · <button type="button" id="b-jiny">' + T.jiny + '</button>';
    $('#b-gdpr').onclick = () => { const sh = sheet('<h3>' + T.gdpr + '</h3><p>' + T.gdprTxt + '</p><button type="button" class="big" id="g-ok">' + T.zavrit + '</button>'); sh.querySelector('#g-ok').onclick = () => sh.remove(); };
    $('#b-jiny').onclick = odhlasit;
  }
  $('#jaz').onclick = () => { nastavJazyk(L === 'uk' ? 'cs' : 'uk'); paticka(); vykresli(); };
  nastavJazyk(L);
  paticka();

  vykresli();
  if (JA) odesli();
  addEventListener('online', odesli);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { const k = document.querySelector('.konec-bg'); if (k) k.remove(); } if (!document.hidden && JA) { odesli(); vykresli(); } });
  setInterval(() => { if (JA && fronta().length) odesli(); }, 30000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', {scope: './'}).catch(() => {});
})();
</script>
</body>
</html>
